.dalt{font-family:lmAlt;line-height:0;font-weight:400}.dalt.x{font-size:1.95em;vertical-align:.155em;margin:0 .02em}.dalt.b{font-size:1.15em;vertical-align:.16em;margin-left:.02em}
:root{--bg:#eef1f5;--fg:#121822;--dim:#5a6577;--card:#ffffff;--borde:#d3d9e2;--chip:#e3e8ef;--acento:#be185d;--sel:#121822;--selfg:#ffffff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--fg:#e8eef5;--dim:#8a95a5;--card:#1a2028;--borde:#2d3643;--chip:#222a35;--acento:#f472b6;--sel:#e8eef5;--selfg:#0f1419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--fg:#e8eef5;--dim:#8a95a5;--card:#1a2028;--borde:#2d3643;--chip:#222a35;--acento:#f472b6;--sel:#e8eef5;--selfg:#0f1419;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
.pag{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:17px;margin:6px 0 0}
.sub{margin:0;color:var(--dim);max-width:70ch}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 14px/1.2 inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde)}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:700 14px/1 inherit;padding:10px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acento)}
.pantalla{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#070b14;border:1px solid var(--borde)}
.mandos{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--borde);background:var(--card);color:var(--fg);font:700 15px/1 inherit;cursor:pointer}
.btn.prin{background:#facc15;border-color:#facc15;color:#111}
.btn:disabled{opacity:.5;cursor:default}
.tiempo{font:600 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);font-variant-numeric:tabular-nums}
select{height:44px;border-radius:12px;border:1px solid var(--borde);background:var(--card);color:var(--fg);font:600 14px/1 inherit;padding:0 10px;max-width:100%;min-width:0}
.selwrap{display:flex;gap:8px;align-items:center;flex:1 1 260px;min-width:0}
.selwrap label{color:var(--dim);font-size:13px;white-space:nowrap}
.selwrap select{flex:1;min-width:0}
.linea{position:relative;height:46px;border-radius:10px;overflow:hidden;display:flex;cursor:pointer;border:1px solid var(--borde);user-select:none;-webkit-user-select:none}
.tramo{position:relative;display:flex;align-items:center;justify-content:center;font:700 11px/1.1 inherit;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:center;padding:0 2px;overflow:hidden;white-space:nowrap}
.tramo small{display:block;font-weight:600;opacity:.8;letter-spacing:0;text-transform:none}
.t-aviso{background:#3a3214}.t-ojo{background:#9d174d}.t-respiro{background:#1f2733}.t-consejo{background:#1e3a5f}.t-indice{background:#4a3d0a}
.galnum{position:absolute;left:10px;top:10px;z-index:5;background:#facc15;color:#111;font:800 16px/1 system-ui,sans-serif;padding:7px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.galtit{font-weight:700;font-size:15px}
.galtit small{display:block;font-weight:500;color:var(--dim);font-size:13px}
.cabezal{position:absolute;top:0;bottom:0;width:3px;background:#facc15;box-shadow:0 0 0 1px rgba(0,0,0,.35);left:0;pointer-events:none}
.nota{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.nota p{margin:0;max-width:75ch}
.nota ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.k{color:var(--acento);font-weight:700}
.dim{color:var(--dim)}
.grupo{display:flex;flex-direction:column;gap:8px}
.grupo h3{margin:10px 0 0;font-size:15px;display:flex;align-items:center;gap:8px}
.punto{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.cons{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.cons .tx{font-size:16px;line-height:1.45;min-width:0}
.cons .tx ul{margin:4px 0 0;padding-left:20px}
.cons .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--dim)}
.cons .meta span{background:var(--chip);border-radius:999px;padding:2px 8px}
.cons .btn{height:36px;padding:0 12px;font-size:13px}
@media (max-width:560px){.cons{grid-template-columns:1fr}.tramo{font-size:9px}.tramo small{display:none}}

/* ===================== la pantalla del aula (1920×1080) ===================== */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#stage *{box-sizing:border-box;margin:0;padding:0}

.capa{position:absolute;inset:0;display:none}
.capa.on{display:block}
#aviso.on,#indice.on{display:flex}
#aviso,#indice{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.ey{font:700 22px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#9aa6bb}
#aviso .num{font:800 200px/.9 "Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#facc15}
#aviso .num i,#mini i{color:#fff;font-style:normal;margin:0 .03em;position:relative;top:-.09em}
#aviso .frase{font:800 54px/1.05 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
#aviso canvas{display:block;width:420px;height:44px;margin-top:12px}
#mini{position:absolute;top:54px;right:76px;font:800 66px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;color:#facc15;display:none}
#mini.on{display:block}
#miniEt{position:absolute;top:18px;right:76px;font:700 27px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:rgba(255,255,255,.78);letter-spacing:.02em;display:none}
#miniEt.on{display:block}
#respiro canvas{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:420px;height:44px}
#indice ol{list-style:none;display:flex;flex-direction:column;gap:18px;margin-top:26px}
#indice li{font:800 58px/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;visibility:hidden}
#indice li.on{visibility:visible}
#indice .tit{font:800 96px/1 "Helvetica Neue",Helvetica,Arial,sans-serif}

/* ¡Ojo! */
.o-big{position:absolute;left:0;right:0;top:300px;display:none;flex-direction:column;align-items:center;gap:26px}
.o-big.on{display:flex}
.o-badge{width:170px;height:170px;border-radius:40px;background:#ec4899;display:flex;align-items:center;justify-content:center;font:900 132px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
.o-big.on .o-badge{animation:golpe .22s steps(4,end) both}
@keyframes golpe{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.o-bigt{font:900 150px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em}
.o-bigs{font:800 62px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#ec4899}
.o-cab{position:absolute;left:96px;top:58px;display:none;align-items:center;gap:20px}
.o-cab.on{display:flex;animation:asoma .2s steps(3,end) both}
@keyframes asoma{0%{transform:translateY(-8px)}100%{transform:none}}
.o-cab .o-badge{width:72px;height:72px;border-radius:18px;font-size:54px;animation:none}
.o-cabt{font:800 44px/1 "Helvetica Neue",Helvetica,Arial,sans-serif}
.o-cabt b{color:#ec4899}
/* (18-oct-2026, Iago: «es importante que en el ojo digas el título del tipo de ejercicio») el tipo, en la línea del «¡Ojo!», grande y blanco; la ficha, al lado y pequeña */
.o-tag{display:flex;align-items:baseline;gap:18px;border-left:4px solid #ec4899;white-space:nowrap;font:800 44px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
#stage .o-tag{margin-left:14px;padding-left:30px}
.o-tag span{font:600 28px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#aab4c5}
.o-tit{position:absolute;left:0;right:0;top:214px;text-align:center;font:800 92px/1 "Helvetica Neue",Helvetica,Arial,sans-serif}
.o-lin{position:absolute;left:0;right:0;text-align:center;font:700 50px/1.15 "Helvetica Neue",Helvetica,Arial,sans-serif}
/* (19-oct-2026) el parrafito del tipo test: un panel oscuro centrado, con el texto que se teclea dentro */
.o-ppar{left:200px;top:372px;width:1520px;height:auto}
#stage .o-ppar{padding:44px 76px}
.o-par{text-align:center;font:600 46px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#eef2f7;text-wrap:balance}
.o-panel{position:absolute;background:#0e141d;border:2px solid #2d3643;border-radius:34px;display:none}
.o-panel.on{display:block}
.o-panel svg{position:absolute;left:0;top:0;overflow:visible}
.o-lab{position:absolute;transform:translateX(-50%);font:800 38px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap}
.rosa{color:#ec4899}
.tapado{visibility:hidden}
/* (17-oct, Iago: «el 7 y la flechita, más hacia la izquierda») el número del grado va centrado en la nota; la flecha cuelga a su derecha */
.o-lab .fl7{position:absolute;left:100%;top:0;padding-left:.22em}
.verde{color:#4ade80}
.o-chip{position:absolute;font:700 34px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#c3ccd9;background:#0e141d;border:3px solid #7b8494;border-radius:999px;padding:14px 30px;white-space:nowrap;font-size:38px}
.o-chip s{text-decoration-thickness:3px}
.tecla-rosa{fill:#ec4899!important}
.o-svgt{fill:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800}
.o-svgt.rosa{fill:#ec4899}.o-svgt.gris{fill:#8a95a5}.o-svgt.verde{fill:#4ade80}
.molde{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.molde h4{margin:0;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.molde h4 small{font-weight:600;color:var(--dim);font-size:12px}
.molde p{margin:0;max-width:80ch}
.molde .ejs{display:flex;flex-wrap:wrap;gap:6px}
.molde .ejs .btn{height:36px;padding:0 12px;font-size:13px}
.molde .claves{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--dim)}
.molde .claves span{background:var(--chip);border-radius:999px;padding:2px 8px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tecl .s{text-decoration:line-through;text-decoration-thickness:3px}
.tachado{text-decoration:line-through;text-decoration-thickness:4px;opacity:.45}
.o-ok{position:absolute;font:900 64px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#4ade80;display:none}
.o-ok.on{display:block;animation:golpe .2s steps(3,end) both}
.o-okl{position:absolute;display:none;margin-left:.3em;color:#4ade80;font-weight:900}
/* (17-oct) excepciones: la señal de alerta y la respuesta en amarillo; lo que se queda de sombra; la cabecita gris de la nota del medio;
   las manos del truco (blancas; la que se mueve, en rosa) */
.amarillo{color:#facc15}.m.amarillo{fill:#facc15}.o-svgt.amarillo{fill:#facc15}
.m.gris{fill:#8a95a5}.o-lab.gris{color:#8a95a5}
.sombra{opacity:.3}
.mano{color:#f8fafc}.mano.rosa{color:#ec4899}
.o-alerta{display:inline-block;position:relative;width:.95em;height:.84em;margin-right:.3em;vertical-align:-.06em;background:#facc15;clip-path:polygon(50% 0,100% 100%,0 100%)}
.o-alerta::after{content:'!';position:absolute;left:0;right:0;bottom:.02em;text-align:center;font:900 .56em/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#111}
.o-okl.on{display:inline-block;animation:golpe .2s steps(3,end) both}
.ver{display:none}
.ver.on{display:block}
.m{font-family:lmMusica;fill:#fff}
.m.rosa{fill:#ec4899}
.m.tenue{fill-opacity:.35}
.lin{stroke:#fff;stroke-width:3.4}
.lin.tenue{stroke-opacity:.35}
.aro{fill:none;stroke:#ec4899;stroke-width:6}
.raya{stroke:#ec4899;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.raya.suave{stroke:#8a95a5}
.tecl .h{visibility:hidden}

/* consejo */
#consejo .c-et{position:absolute;left:50%;top:300px;transform:translateX(-50%);display:none;align-items:center;gap:14px;border:3px solid currentColor;border-radius:999px;padding:16px 34px;font:800 30px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
#consejo .c-et.on{display:flex}
#consejo .c-tx{position:absolute;left:220px;right:220px;top:410px;text-align:center;text-wrap:balance;font:700 64px/1.28 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
#consejo .c-tx .dest{color:var(--dest,#facc15)}
.k-rit{color:#34d399!important}.k-mel{color:#5bd0ff!important}.k-ton{color:#ff9a3c!important}.k-arm{color:#bd92ff!important}
/* (Iago) «Carrusel» con las letras de la app PreDict Carrusel */
.carr{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;letter-spacing:0;text-transform:none;padding:0 .08em 0 .02em;background:linear-gradient(100deg,#5bd0ff 8%,#ff9a3c 52%,#bd92ff 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
#consejo .c-et .carr{font-size:40px;line-height:1;display:inline-block;transform:rotate(-6deg) translateY(-3px);filter:drop-shadow(0 2px 10px rgba(91,208,255,.35))}
#consejo .c-tx .li{display:block;font-size:56px;font-weight:600;margin-top:10px}
/* (17-oct-2026) los recordatorios de la clase (los manda el iPad), como en la cuenta atrás de la escaleta: contorno violeta y su icono */
.rec{display:flex;align-items:center;gap:18px;max-width:1300px;padding:14px 30px 14px 22px;border-radius:18px;border:2px solid rgba(167,139,250,.6);text-align:left;margin-bottom:10px}

    "2.1": ["Duración e [intensidad]", "El sonido es una *onda mecánica*. Sus rebotes se oyen como *reverb* (menos de 50 ms) o como *eco* (más de 50 ms). La intensidad se mide en *decibelios (dB)*, con un *sonómetro*."],
    "2.2": ["Altura y [timbre]", "La *altura* se mide en *hercios (Hz)*: el La4 vibra a *440 Hz* y oímos de 20 a 20.000 Hz. El *timbre* depende de *cuánto suena cada armónico*."],
    "2.3": ["La [serie armónica]", "Cada nota trae su *fundamental* y sus *armónicos*, siempre hacia el agudo. Estudiamos los *8 primeros*: los 1, 2, 4 y 8 son la misma nota, en *octavas*."],
    "3.1": ["La [atonalidad]", "La música *atonal* no tiene *centro tonal*. El azar puede entrar al *crear* la obra (los dados) o al *interpretarla*; y en la composición libre decide el compositor, sin azar ni reglas."],
    "3.2": ["El [dodecafonismo]", "*Schoenberg*: los *12 sonidos* sin repetir ninguno hasta que suenen todos. La serie *P0*, su retrógrada (*R*), su inversión (*I*) y la RI, en los 12 transportes: *48 variaciones*."],
    "3.3": ["Música [estocástica]", "La música *estocástica* (*Xenakis*, *Metástasis*) nace de la *probabilidad* y los datos: a cada dato se le asigna un *parámetro musical*."],
    "4.1": ["El [magnetófono]", "El *magnetófono* (Alemania, *años 30*) graba *magnetizando una cinta* de partículas metálicas: el cabezal es un *electroimán*. Nada que ver con el surco del fonógrafo."],
    "4.2": ["Música [concreta]", "Con el magnetófono nace la *música concreta*: *sonidos grabados* que se manipulan en la cinta, cortando y pegando *de verdad*, acelerando, rebobinando…"],
    "4.3": ["Nuevas [grafías]", "Las *nuevas grafías* (escritura moderna) reducen la partitura a la *mínima expresión*: ya no se agrupa por pulsos y el compás deja de ser relevante."],
    "5.1": ["El [blues]", "El *blues* nace de los *cantos de trabajo* de los esclavos africanos en América: modo *mixolidio*, *12 compases*, pregunta y respuesta e *improvisación*. Es el abuelo del rock."],
    "5.2": ["GVE en [varios pulsos]", "Para los *grupos de valoración especial en varios pulsos*: primero, un *compás modelo*; luego, el *borrador*, con tantos grupos como pulsos. Lo razonado *se guarda* y se reutiliza."],
    "8.1": ["La [modulación]", "*Modular* es *viajar de una tonalidad a otra*. Le da al compositor más recursos, como explorar el mapa en un mundo abierto: *diatónica*, *cromática* o *enarmónica*."],
    "8.2": ["Modulación [diatónica]", "La modulación *diatónica* usa un *acorde puente común* a las dos tonalidades (mismas notas y mismo modo) y se asienta con la *dominante*, mayor y con 7.ª."],
    "8.3": ["Otras [modulaciones]", "La *cromática* va a tonalidades lejanas con acordes que solo cambian en *algún cromatismo*; la *enarmónica*, la menos común, *reinterpreta* notas del acorde puente."],
    "9.1": ["El [transporte]", "*Transportar* es tocar o escribir una obra *en otra tonalidad*, sin cambiar el modo. El transporte *escrito* reescribe la obra: cuesta hacerlo, pero luego solo hay que tocar."],
    "9.2": ["Transporte [mental]", "En el transporte *mental* se cambian, en la cabeza, la *armadura* y la *clave*. Las *diferencias* corrigen las alteraciones accidentales para que el intervalo sea exacto."]
  };
  [
    ["¿Quién presentó el fonógrafo en 1877?", "Edison y el [fonógrafo]", "El fonógrafo lo presentó *Thomas Edison* en *1877*. Fue el primer aparato capaz de *grabar y reproducir* el sonido: una aguja grababa las vibraciones de la voz en un cilindro."],
    ["¿De qué material era el cilindro donde se grababa el sonido en el fonógrafo?", "El cilindro de [cera]", "En el fonógrafo, el sonido se grababa en un *cilindro de cera*: la aguja abría un *surco* que copiaba las vibraciones. El disco de vinilo y la cinta magnética llegaron mucho después."],
    ["En el fonógrafo, ¿qué función cumple el cono?", "El [cono] del fonógrafo", "El *cono* hacía dos trabajos. Al grabar, recogía la voz y la llevaba hasta la aguja: era el *micrófono*. Al reproducir, agrandaba el sonido que sacaba la aguja para que se oyera: era el *resonador*."],
    ["¿Cuál era una limitación clara del fonógrafo?", "Los cilindros se [gastaban]", "Cada vez que se escuchaba un cilindro, la aguja *desgastaba el surco*, y el sonido se iba perdiendo *con cada uso*. Y no necesitaba electricidad: era un aparato *mecánico*, de manivela."],
    ["El fonógrafo fue importante porque permitió, por primera vez…", "Grabar y [reproducir]", "Con el fonógrafo, por primera vez, el sonido se pudo *guardar*: *grabar* lo que sonaba y *reproducirlo* después. Hasta entonces, la música solo existía mientras alguien la tocaba."],
    ["Los compases mixtos se caracterizan por…", "Compases [mixtos]", "Un compás *mixto* une compases con *denominadores distintos*, como *2/4 + 1/8*: dos negras y una corchea. Es una de las tres formas de escribir el mismo compás, junto al decimal y al fraccionario."],
    ["¿Qué distingue a un compás decimal?", "Compases [decimales]", "En un compás *decimal*, el *numerador lleva decimales*: *2,5/4* son dos negras y media, es decir, dos negras y una corchea. El denominador sigue diciendo la figura del pulso."],
    ["Un compás fraccionario es…", "Compases [fraccionarios]", "Un compás *fraccionario* es un compás de los de siempre al que se le *suma o se le resta una fracción* de pulso. Por ejemplo, un 2/4 con *medio pulso más*: dos negras y una corchea."],
    ["En un compás fraccionario, la fracción hace referencia a…", "La fracción es del [pulso]", "En el compás fraccionario, la fracción se cuenta sobre la *figura del pulso*. Si el pulso es la negra, *½* es media negra (una corchea) y *¼*, un cuarto de negra (una semicorchea)."],
    ["Mixtos, decimales y fraccionarios son…", "Tres formas, [un compás]", "*Mixto*, *decimal* y *fraccionario* son *tres maneras de escribir lo mismo*: 2/4 + 1/8, 2,5/4 y un 2/4 con medio pulso más duran exactamente igual. Cambia la escritura, no lo que suena."],
    ["Bartók y Kodály hallaron estos ritmos inusuales investigando…", "Bartók y [Kodály]", "*Bartók* y *Kodály* recorrieron las *aldeas* de Hungría y sus alrededores grabando con fonógrafo la *música popular*. Allí encontraron estos ritmos irregulares y los llevaron a sus obras: es el *Nacionalismo musical*."],
    ["El sonido es una vibración que se propaga como…", "Una [onda mecánica]", "El sonido es una *vibración* que viaja como *onda mecánica*: necesita un *medio* (aire, agua, madera…) para propagarse. Por eso en el *vacío* no hay sonido."],
    ["Una reflexión del sonido inferior a 50 ms se percibe como…", "La [reverb]", "Cuando el sonido rebota y vuelve en *menos de 50 ms*, el oído no lo separa del original: lo oímos pegado a él, como una *cola* que alarga el sonido. Es la *reverb*."],
    ["Una reflexión superior a 50 ms se percibe como…", "El [eco]", "Si el rebote tarda *más de 50 ms* en volver, el oído ya lo separa del sonido original y lo oímos *repetido*: es el *eco*. Con menos de 50 ms no se separa: es la reverb."],
    ["La capacidad del sonido de atravesar los materiales se llama…", "La [refracción]", "La *refracción* es la capacidad del sonido de *atravesar los materiales*. Por eso oímos la música del vecino a través de la pared, aunque apagada: pasan sobre todo los *graves*."],
    ["Que el sonido gire esquinas o se cuele por huecos minúsculos es la…", "La [difracción]", "Por la *difracción*, el sonido *rodea los obstáculos* y se cuela por *huecos* muy pequeños. Por eso oyes a alguien que habla detrás de una esquina, aunque no lo veas."],
    ["La unidad objetiva para medir la intensidad es…", "Los [decibelios]", "Piano o forte son medidas *subjetivas*. La unidad *objetiva* de la intensidad es el *decibelio (dB)*, y se mide con un *sonómetro*. *0 dB* no es el silencio absoluto: ese *no existe*, solo podemos acercarnos a él. Por encima de *85 dB*, durante horas, el oído se daña."],
    ["Para que una sala suene seca (rebote mínimo) se usan materiales…", "Una sala [seca]", "Para que una sala suene *seca*, casi sin rebote, se llena de materiales *absorbentes*: cortinas, alfombras, paneles, muebles… Las superficies duras y lisas (metal, cristal, azulejo) hacen lo contrario: *reflejan*."],
    ["La altura del sonido se mide objetivamente en…", "La altura, en [hercios]", "La *altura* (si un sonido es agudo o grave) se mide en *hercios (Hz)*: cuantas más vibraciones por segundo, más aguda es la nota. Los decibelios miden otra cosa: la intensidad."],
    ["Los hercios indican…", "¿Qué es un [hercio]?", "Un *hercio* es *una vibración por segundo*. El La4 vibra *440 veces* cada segundo: 440 Hz. Si doblas los hercios, la nota sube una *octava*: 880 Hz es el La5."],
    ["La frecuencia de resonancia del La4 (afinación estándar) es…", "El [La 440]", "La nota de afinación estándar es el *La4 = 440 Hz*: el La del diapasón, con el que afina la orquesta. Una octava más grave, el La3, vibra a la mitad: *220 Hz*."],
    ["El límite inferior de la audición humana está en torno a…", "De [20] a 20.000 Hz", "El oído humano oye, más o menos, de *20 Hz* (lo más grave) a *20.000 Hz* (lo más agudo). Por debajo están los *infrasonidos*; por encima, los *ultrasonidos*, que sí oye un murciélago."],
    ["El timbre es la cualidad que permite…", "El [timbre]", "El *timbre* es el «color» del sonido: lo que te deja saber si una nota la toca un *oboe*, un *clarinete* o la canta una *voz*, aunque sea la misma nota y con la misma fuerza."],
    ["El timbre se determina por…", "El timbre y los [armónicos]", "Toda nota lleva dentro sus *armónicos*. El timbre depende de *cuánto suena cada uno*, de la *proporción* entre sus intensidades. Cambia esa proporción y un *oboe* empieza a sonar a *clarinete*."],
    ["La misma nota en dos instrumentos distintos: sus armónicos…", "Misma nota, [otro timbre]", "Un oboe y un clarinete que tocan el mismo La tienen sus armónicos *en los mismos sitios* (las mismas frecuencias). Lo que cambia es *cuánto suena cada armónico*: por eso suenan distinto."],
    ["Un sonido es \"puro\" (sin armónicos) solo cuando…", "El sonido [puro]", "Un sonido *puro*, sin armónicos (una sola frecuencia), no lo da ningún instrumento ni ninguna voz: solo se consigue *sintetizándolo*, con un oscilador. Por eso suena tan «electrónico»."],
    ["Al tocar una nota, en realidad escuchamos…", "La [serie armónica]", "Cuando suena una nota no oímos un sonido solo: oímos la *fundamental* (la nota que reconocemos) y, encima, sus *armónicos*, más débiles. Juntos forman la *serie armónica* y le dan su timbre."],
    ["La serie armónica que estudiamos se acota a los…", "Los [8 primeros]", "Los armónicos siguen hacia el agudo, cada vez *más débiles* y *más juntos*. Por eso, de la serie armónica estudiamos solo los *8 primeros sonidos*."],
    ["El código de la serie se refiere a intervalos…", "Siempre [hacia arriba]", "La serie armónica se construye *hacia el agudo*, empezando en la *fundamental*: los intervalos de su código son *siempre ascendentes*. La serie nunca baja de la fundamental."],
    ["En la serie de un Mi, las posiciones 1, 2, 4 y 8 son…", "1, 2, 4 y 8: [octavas]", "En la serie armónica, las posiciones *1, 2, 4 y 8* son siempre *la misma nota* que la fundamental, cada vez una *octava* más arriba. En la serie de Mi: *Mi*, *Mi*, *Mi* y *Mi*."],
    ["Un tambor suena \"indeterminado\" porque…", "Altura [indeterminada]", "Un *tambor* produce *tantísimos armónicos*, y tan desordenados, que el cerebro no consigue colocarlos en una nota. Por eso decimos que su sonido es de *altura indeterminada*."],
    ["El intervalo entre la fundamental y el 2.º armónico es una…", "Del 1 al 2: [octava]", "Entre la fundamental y el *2.º armónico* hay una *octava*: el 2.º vibra *el doble* de rápido. Si la fundamental es un La de 220 Hz, el 2.º armónico es el La de 440 Hz."],
    ["La atonalidad se define, a grandes rasgos, como música que…", "La [atonalidad]", "La música *atonal* no tiene un *centro tonal*: ninguna nota manda sobre las demás. No hay tónica a la que volver, ni jerarquía de reposo y tensión como en la música tonal."],
    ["La aleatoriedad puede aparecer en dos momentos:", "El [azar], ¿cuándo?", "El *azar* puede entrar en la música en dos momentos: al *crearla* (el compositor decide tirando dados, por ejemplo) o al *interpretarla* (el músico decide mientras toca). O en los dos."],
    ["Lanzar unos dados asignando un sonido a cada número es aleatoriedad en…", "Azar al [crear]", "Si el compositor tira *dados* y a cada número le asigna un sonido, el azar está en la *creación*. Una vez escrita, la obra queda *fija*: se toca siempre igual."],
    ["Si el intérprete sigue indicaciones para ir construyendo la obra, la aleatoriedad está en…", "Azar al [interpretar]", "Si la partitura da *indicaciones* y el músico va *construyendo la obra* mientras la toca, el azar está en la *interpretación*: cada vez que se toca, suena distinta."],
    ["La \"composición libre\" atonal consiste en…", "Composición [libre]", "En la *composición libre* atonal no hay azar ni reglas fijas como las del dodecafonismo: cada nota es una *decisión particular* del compositor."],
    ["El dodecafonismo fue impulsado sobre todo por…", "[Schoenberg]", "El *dodecafonismo* lo impulsó sobre todo *Arnold Schoenberg*, en *Viena*, en los años 20 del siglo XX. Lo siguieron sus alumnos *Berg* y *Webern*."],
    ["La regla básica del dodecafonismo es…", "Los [12 sonidos]", "La regla del *dodecafonismo*: usar los *12 sonidos* de la escala cromática *sin repetir ninguno* hasta que hayan sonado todos. Así ninguna nota se convierte en tónica."],
    ["La serie original se llama…", "La serie [P0]", "La serie original, tal como la escribe el compositor, se llama *P0* (*Principal cero*). De ella salen las demás: la retrógrada (*R*), la inversión (*I*) y sus transportes."],
    ["Obtener P5 significa…", "Transportar: [P5]", "El número dice el *transporte* en *semitonos ascendentes*: *P5* es la serie original subida *5 semitonos*. Si P0 empieza en Do, P5 empieza en *Fa*."],
    ["La serie retrógrada (R) consiste en…", "La [retrógrada]", "La *retrógrada (R)* es la serie *al revés*: de la última nota a la primera. Los mismos sonidos, leídos hacia atrás."],
    ["La inversión (I) consiste en…", "La [inversión]", "En la *inversión (I)*, cada intervalo *cambia de dirección*: lo que subía, *baja*, y lo que bajaba, *sube*, con los mismos semitonos. Es la serie en espejo."],
    ["Sumando todas las variantes, la serie principal genera un total de…", "[48] variaciones", "Cada forma de la serie (*P*, *R*, *I* y *RI*, la retrógrada de la inversión) se puede transportar a los *12 sonidos*: 4 × 12 = *48 variaciones* de una sola serie."],
    ["El serialismo integral se caracteriza por…", "Serialismo [integral]", "El *serialismo integral* lleva la idea de la serie más allá de las notas: también se ordenan en series el *ritmo*, la *intensidad*, el *timbre*, las articulaciones…"],
    ["Para los dodecafónicos, la octava en la que se coloca cada nota…", "La octava, [libre]", "Para los dodecafónicos cuenta el *nombre de la nota*, no su *octava*: un Do puede sonar grave o agudo y sigue siendo el mismo sonido de la serie."],
    ["La música estocástica se basa en…", "Música [estocástica]", "La música *estocástica* nace de procesos *matemáticos*: la *probabilidad* y el análisis de datos. Su gran nombre es *Iannis Xenakis*, que además era ingeniero y arquitecto."],
    ["Un ejemplo de obra estocástica es…", "[Metástasis]", "*Metástasis*, de *Iannis Xenakis*, es el ejemplo clásico de música estocástica: los glissandos de la cuerda se calcularon como líneas rectas, igual que en sus planos de arquitectura."],
    ["En la música estocástica se parte de datos a los que…", "De los datos [a la música]", "Se parte de *datos* (números, cálculos, estadísticas) y a cada dato se le asigna un *parámetro musical*: una altura, una duración, una intensidad… Los números deciden la música."],
    ["La música estocástica encaja dentro de la música…", "Estocástica y [atonal]", "La música estocástica es *atonal*, y su azar está en la *creación*: los cálculos deciden las notas, pero una vez escrita, la obra se toca siempre igual."],
    ["El magnetófono graba el sonido mediante…", "El [magnetófono]", "El *magnetófono* graba el sonido *magnetizando una cinta*: la señal ordena las partículas de la cinta y, al leerlas otra vez, el sonido vuelve."],
    ["El magnetófono nació en Alemania en los años…", "Alemania, [años 30]", "El magnetófono nació en *Alemania* en los *años 30* y se comercializó en los *50*. Con él llegó la grabación en *cinta*, que se podía cortar, pegar y volver a grabar."],
    ["Las partículas de la cinta de cassette son…", "Partículas [magnéticas]", "La cinta, como la del *casete*, está cubierta de *partículas metálicas* que se pueden *magnetizar*. Al grabar, la señal las ordena; al reproducir, ese orden vuelve a ser sonido."],
    ["La cinta pasa por un cabezal que es…", "El [cabezal]", "El *cabezal* es un *electroimán*: una *bobina* de cable enrollada. Al grabar, la señal crea un campo magnético que magnetiza la cinta que pasa por delante."],
    ["Respecto al fonógrafo, el magnetófono es un sistema de grabación…", "Mecánico y [magnético]", "El fonógrafo era *mecánico*: una aguja abría un surco en cera. El magnetófono es *magnético*: no hay surco, la cinta guarda el sonido en sus partículas. Son sistemas *totalmente distintos*."],
    ["La música concreta surge al popularizarse…", "Música [concreta]", "La *música concreta* surge cuando se populariza el *magnetófono*: por fin se podían grabar sonidos en cinta y *manipularlos*. Su pionero fue *Pierre Schaeffer*, en París."],
    ["La música concreta consiste en…", "Sonidos [grabados]", "La *música concreta* se hace con *sonidos grabados* (trenes, voces, objetos…) que luego se *manipulan*: cortar, pegar, acelerar, ralentizar, dar la vuelta a la cinta…"],
    ["\"Cortar y pegar\" en la música concreta era…", "Tijeras y [cinta]", "En la música concreta, cortar y pegar era *literal*: se cortaba la *cinta* con cuchilla y se pegaba en otro orden. Mucho antes de cortar y pegar en el ordenador."],
    ["¿Cuál NO es una manipulación típica de la música concreta?", "Manipular la [cinta]", "Las manipulaciones de la música concreta se hacen con la *cinta*: *rebobinar*, *acelerar o decelerar*, cortar y pegar, hacer bucles… *Armonizar a cuatro voces* es otra cosa: armonía clásica."],
    ["Las nuevas grafías (escritura moderna) buscan…", "Nuevas [grafías]", "Las *nuevas grafías* reducen la escritura a la *mínima expresión gráfica*: solo lo necesario para tocar, sin agrupar por pulsos ni detallar cada cosa."],
    ["En la notación tradicional, la prioridad es…", "Agrupar por [pulsos]", "En la notación *tradicional*, lo primero es *agrupar las figuras por pulsos*: así el músico ve de un vistazo dónde cae cada parte del compás."],
    ["Otro nombre de las nuevas grafías es…", "Escritura [moderna]", "A las *nuevas grafías* también se las llama *escritura moderna* o *notación minimalista*: escribir la música con el mínimo de signos."],
    ["En las nuevas grafías, el compás indicado…", "El compás, [sin importancia]", "En las nuevas grafías el *compás no es relevante*: como ya no se agrupa por pulsos, el compás escrito deja de importar para leer la música."],
    ["El blues nace de…", "El origen del [blues]", "El *blues* nace de los *cantos de trabajo* de los *esclavos africanos* en América, en las plantaciones del sur de Estados Unidos, a finales del siglo XIX."],
    ["La escala característica del blues es el modo…", "Blues y [mixolidio]", "El blues se apoya en el modo *mixolidio*: una escala mayor con la *7.ª rebajada*. Por ejemplo, Sol mixolidio: sol, la, si, do, re, mi y *fa natural*."],
    ["La estructura típica del blues es de…", "[12] compases", "El blues típico dura *12 compases*, en *tres frases* de cuatro: la primera dice algo, la segunda lo repite y la tercera responde."],
    ["El estilo \"responsorial\" del blues consiste en…", "Pregunta y [respuesta]", "En el estilo *responsorial*, *uno canta* una frase y *los demás responden*, como en los cantos de trabajo. También pasa entre la voz y la guitarra: una pregunta, la otra contesta."],
    ["El blues recupera de los antiguos el valor de…", "[Improvisar]", "Frente a la partitura cerrada, en la que el compositor lo indica todo, el blues recupera la *improvisación*, como hacían los músicos antiguos: cada versión es distinta."],
    ["El blues es una mezcla de expresividad africana, show estadounidense y técnica…", "Una [mezcla]", "El blues mezcla tres mundos: la *expresividad africana*, el *espectáculo estadounidense* y la *técnica europea*, con sus instrumentos y su armonía."],
    ["¿Cuál de estos géneros tiene al blues como \"abuelo\"?", "El [abuelo] del rock", "El blues es el abuelo de buena parte de la música de hoy: de él vienen el *rock*, el *pop*, el *soul* y el *hip hop*."],
    ["El reto rítmico central del 2.º trimestre son…", "GVE en [varios pulsos]", "El gran reto rítmico del *2.º trimestre* son los *grupos de valoración especial* (tresillos, cinquillos…) repartidos en *varios pulsos*."],
    ["El primer paso del método es…", "Paso 1: [compás modelo]", "El método para los grupos de valoración especial en varios pulsos empieza siempre por el mismo paso: *establecer un compás modelo*. Todo lo demás se apoya en él."],
    ["Al hacer el borrador se ponen tantos grupos de la valoración especial como…", "El [borrador]", "En el *borrador* se escriben *tantos grupos* de la valoración especial *como pulsos tiene el compás*: para un cinquillo en 3 pulsos, *3 cinquillos*."],
    ["Una vez razonado un grupo (p. ej. cinquillo en 3 pulsos)…", "Se [guarda] y se reutiliza", "Un grupo se razona *una sola vez*: cuando ya sabes cómo va, por ejemplo, un *cinquillo en 3 pulsos*, *guardas su estructura* y la aplicas tal cual cada vez que vuelva a salir."],
    ["Modular consiste en…", "[Modular]", "*Modular* es *viajar de una tonalidad a otra* dentro de la misma obra: la música cambia de casa y una nueva tónica pasa a mandar."],
    ["La tonalidad se definió como…", "La [tonalidad]", "La *tonalidad* es un *sistema jerárquico* de sonidos: la *tónica* es el reposo, la *dominante* es la tensión, y cada grado tiene su papel alrededor de ellas."],
    ["Modular aporta al compositor…", "¿Para qué [modular]?", "Modular le da al compositor *más recursos*: nuevas tonalidades, nuevos colores y un *espacio sonoro más amplio*, para que la obra no se quede siempre en la misma casa."],
