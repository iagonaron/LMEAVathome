<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi actitud</title>
<!-- (12-nov-2026, Iago) «Mis resultados» → botón «Mi actitud»: las fuerzas que restan, suman o son neutras de este trimestre, la escalera
     de actitud con la línea blanca y, al entrar, la línea viaja desde donde la viste la última vez hasta donde está ahora.
     1.er trimestre: sin parámetros ni nota (aviso). Desde el 2.º: el punto de partida es lo que marcó Iago el trimestre anterior.
     Maqueta para el vídeo: ?caso=gp1 | gp2 | ge1 | ge2 (datos de un alumno de ejemplo). -->
<style>
:root{--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--tinta:#f4f4f5;--suave:#a1a1aa;--card:rgba(13,17,28,.9);--bd:rgba(255,255,255,.14);--oro:#facc15}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tinta);font-family:var(--f);overflow:hidden;background:#0b1020}
body{background:linear-gradient(rgba(6,9,18,.62),rgba(6,9,18,.62)),url(fondo.jpg) center/cover no-repeat;display:grid;grid-template-rows:auto auto 1fr auto;gap:1.6vh;padding:1.6vh 2vw 2.2vh}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.btn{justify-self:start;border:0;border-radius:10px;background:var(--oro);color:#111;font:800 clamp(12px,1vw,16px)/1 var(--f);padding:.85em 1.5em;cursor:pointer}
.tit{display:flex;align-items:center;gap:.6vw;font:900 clamp(16px,1.35vw,24px)/1 var(--f)}
.tit i{display:grid;place-items:center;width:2.2vw;height:2.2vw;min-width:28px;min-height:28px;border-radius:8px;background:var(--oro);color:#111;font-style:normal;font-size:.9em}
.quien{justify-self:end;text-align:right;font:600 clamp(11px,.85vw,14px)/1.35 var(--f);color:#cbd5e1}.quien b{display:block;color:#fff;font-size:1.1em}
.aviso{background:var(--card);border:1px solid rgba(250,204,21,.45);border-left:5px solid var(--oro);border-radius:14px;padding:1.2vh 1.4vw;font:500 clamp(12px,1.05vw,18px)/1.45 var(--f);color:#e4e4e7}
.aviso b{color:#fff}
.aviso{display:flex;align-items:center;gap:1.2vw}.aviso>span{flex:1}
.aviso.tint{animation:avisoT 1.1s ease-in-out infinite}
@keyframes avisoT{50%{background:rgba(250,204,21,.22);border-color:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,.6),0 0 30px rgba(250,204,21,.35)}}
.aviso button{flex:0 0 auto;border:0;border-radius:10px;background:var(--oro);color:#111;font:800 clamp(11px,.9vw,15px)/1 var(--f);padding:.8em 1.3em;cursor:pointer}
main{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:1.6vw;min-height:0}
.col{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:2vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;min-height:0;overflow:hidden}
.col h2{margin:0;font:900 clamp(11px,.95vw,16px)/1 var(--f);letter-spacing:.14em;text-transform:uppercase}
.col.contra{border-color:rgba(239,68,68,.5)}.col.contra h2{color:#fca5a5}
.col.favor{border-color:rgba(34,197,94,.5)}.col.favor h2{color:#86efac}
.tope{margin-top:-.4vh;font:600 clamp(10px,.85vw,14px)/1.2 var(--f);color:var(--suave)}
.lista{display:flex;flex-direction:column;gap:1vh;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:.3vw;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.neuw{flex:0 1 auto;max-height:46%;min-height:9vh;padding:1vh .6vw .8vh;margin:0 -.3vw -.2vh;border:1.5px dashed #3f3f46;border-radius:12px;display:flex;flex-direction:column;gap:.8vh}
.neuw h2{color:#a1a1aa!important;font-size:clamp(10px,.8vw,13px)!important}
.fz{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.7vw;padding:1.1vh .9vw;border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);
  flex:0 0 auto;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.fz.ve{opacity:1;transform:none}
.fz b{display:block;font:800 clamp(12px,1.15vw,20px)/1.15 var(--f)}
.fz small{display:block;margin-top:.4vh;font:500 clamp(10px,.85vw,14px)/1.3 var(--f);color:var(--suave)}
.fz .v{font:900 clamp(16px,1.8vw,32px)/1 var(--f);color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.fz em{font-style:normal;display:inline-block;margin-left:.4em;padding:.05em .4em;border-radius:6px;border:1px solid currentColor;font:700 .7em/1.3 var(--f);color:#fde68a;vertical-align:.15em}
.fz.neutro{--c:#a1a1aa;background:rgba(161,161,170,.13)}
.fz.neutro .v{color:#d4d4d8}
.fz.tex{border-color:var(--bd);background:linear-gradient(90deg,rgba(var(--rgb),.93),rgba(var(--rgb),.55)),var(--tex) var(--pos,50% 50%)/cover no-repeat,rgb(var(--rgb));text-shadow:0 1px 3px rgba(0,0,0,.7)}
.fz.tex b{color:var(--tono)}.fz.tex small{color:#f4f4f5}
.fz.tex.rojo{border-color:#ef4444;background:linear-gradient(90deg,rgba(127,29,29,.94),rgba(127,29,29,.6)),var(--tex) var(--pos,50% 50%)/cover no-repeat,#450a0a}.fz.tex.rojo b{color:#fecaca}
.fz.tex.gris{border-color:#a1a1aa;background:linear-gradient(90deg,rgba(39,39,42,.93),rgba(39,39,42,.55)),var(--tex) var(--pos,50% 50%)/cover no-repeat,#27272a}.fz.tex.gris b{color:#e4e4e7}
.xs{display:flex;gap:.6vw;margin-top:.6vh;flex-wrap:wrap}
.x{display:flex;flex-direction:column;align-items:center;gap:.3vh;font:700 clamp(9px,.7vw,12px)/1 var(--f);color:#d4d4d8}
.x i{width:clamp(18px,1.6vw,30px);height:clamp(18px,1.6vw,30px);border-radius:7px;display:grid;place-items:center;font:900 clamp(11px,1vw,19px)/1 var(--f);font-style:normal;color:#fff;background:var(--xc)}
.x.roja{--xc:#ef4444}.x.azul{--xc:#3b82f6}
.vacio{font:500 clamp(11px,.9vw,15px)/1.4 var(--f);color:var(--suave)}
/* la escalera */
.esc{background:transparent;border:0;padding:0 .2vw;display:flex;flex-direction:column;min-height:0}
.esc h2{margin:0 0 1vh;font:900 clamp(11px,.95vw,16px)/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:#d4d4d8;padding-left:1vw}
.lad{position:relative;flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,1fr);gap:.9vh}
.pel{position:relative;border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(10,12,20,.92));display:flex;align-items:center;padding-left:1.3vw;
  font:900 clamp(13px,1.5vw,27px)/1 var(--f);letter-spacing:.05em;color:#fff;transition:background .7s,color .7s,box-shadow .7s;overflow:hidden}
.pel::after{content:"";position:absolute;left:40%;right:0;top:50%;border-top:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.pel i,.pel u{position:absolute;right:1vw;font:700 clamp(10px,.85vw,15px)/1 var(--f);font-style:normal;text-decoration:none;color:var(--suave)}
.pel i{top:22%}.pel u{bottom:22%}
.pel s{text-decoration:none;opacity:0;transition:opacity .5s}
.pel.on{background:var(--c);color:#0b0b0c;box-shadow:0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
.pel.on i,.pel.on u{color:rgba(0,0,0,.55)}.pel.on.mas s{opacity:1}
.lad.sin .pel{filter:saturate(.35) brightness(.75)}
.aguja{position:absolute;left:-.7vw;right:-.7vw;height:0;top:0;z-index:5;transition:top 3.2s cubic-bezier(.5,0,.2,1);pointer-events:none}
.aguja i{position:absolute;left:0;right:0;top:-2px;height:4px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff,0 0 22px rgba(255,255,255,.7);animation:respira 2.8s ease-in-out infinite}
@keyframes respira{0%,100%{transform:translateY(-1px)}50%{transform:translateY(1.5px)}}
.aguja em{position:absolute;left:84%;top:0;transform:translate(-50%,-50%);padding:.18em .45em;border-radius:8px;background:#fff;color:#0a0a0b;font:900 clamp(13px,1.4vw,26px)/1 var(--f);font-style:normal;font-variant-numeric:tabular-nums;box-shadow:0 0 18px rgba(255,255,255,.6)}
.aguja.bote i,.aguja.bote em{animation:lat .55s ease-in-out infinite alternate}
@keyframes lat{to{opacity:.2}}
.aguja.duda i{background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 18px);box-shadow:none;opacity:.8}
.aguja.duda em{background:#18181b;color:#fff;border:2px dashed rgba(255,255,255,.7);box-shadow:none}
.base{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed rgba(255,255,255,.55);z-index:4;pointer-events:none;opacity:0;transition:opacity .4s}
.base span{position:absolute;left:44%;bottom:3px;font:700 clamp(9px,.8vw,13px)/1 var(--f);color:rgba(255,255,255,.8);white-space:nowrap}
.pie-esc{margin-top:1vh;text-align:left;padding-left:1vw;font:600 clamp(11px,.95vw,16px)/1.3 var(--f);color:#e4e4e7}.pie-esc b{color:var(--oro)}
.bal{position:relative;z-index:9;background:rgba(13,17,28,.97)!important;margin-top:.8vh;display:grid;grid-template-columns:auto 1fr;gap:.2vh .9vw;align-items:center;padding:.8vh .9vw;border-radius:12px;background:var(--card);border:1.5px solid rgba(255,255,255,.22);opacity:0;transition:opacity .6s}
.bal.ve{opacity:1}
.bal b{grid-row:span 3;font:900 clamp(18px,2vw,34px)/1 var(--f);font-variant-numeric:tabular-nums}
.bal .bb{position:relative;height:clamp(10px,.9vw,16px);border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bal .bb::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:2px solid rgba(255,255,255,.7)}
.bal .bb i{position:absolute;top:0;bottom:0;width:0;transition:width 1.4s cubic-bezier(.4,0,.2,1)}
.bal .bb i.r{right:50%;background:#ef4444}.bal .bb i.v{left:50%;background:#22c55e}
.bal .bb em{position:absolute;top:50%;width:4px;height:160%;margin-left:-2px;transform:translateY(-50%);background:#fff;box-shadow:0 0 8px #fff;transition:left 1.4s cubic-bezier(.4,0,.2,1);left:50%}
body.f-bal .bal{box-shadow:0 0 0 3px #facc15,0 0 36px rgba(250,204,21,.6)}
.bal span{font:800 clamp(10px,.8vw,13px)/1.2 var(--f);letter-spacing:.12em;text-transform:uppercase;color:#d4d4d8}
.bal small{font:500 clamp(10px,.78vw,13px)/1.3 var(--f);color:#a1a1aa}
.cont{flex:0 0 auto;padding:1.4vh 1vw 1.2vh;border-radius:14px;border:2px solid rgba(34,197,94,.6);background:rgba(34,197,94,.08);transition:box-shadow .5s,transform .5s;transform-origin:center top}
.cont-t{display:flex;justify-content:space-between;align-items:baseline;gap:.6vw;font:800 clamp(11px,.95vw,16px)/1.2 var(--f);color:#e4e4e7}
.cont-t b{flex:0 0 auto;white-space:nowrap;font:900 clamp(16px,1.6vw,28px)/1 var(--f);color:#4ade80;font-variant-numeric:tabular-nums}
.cont-b{margin-top:1vh;height:clamp(14px,1.4vw,24px);border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.cont-b::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed rgba(255,255,255,.35)}
.cont-b i{display:block;height:100%;width:0;background:#22c55e;border-radius:6px;transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.cont small{display:block;margin-top:.7vh;font:600 clamp(10px,.85vw,14px)/1.3 var(--f);color:#a1a1aa}
body.f-barra .cont{transform:scale(1.04)}
.cont.lleno .cont-t b{color:#facc15}
.cont.lleno{animation:avisoT 1.1s ease-in-out infinite}
.cont.lleno{border-color:#facc15}.cont.lleno .cont-b i{background:#facc15}.cont.lleno small{color:#fde68a}
body.f-barra .cont,body.f-sug .sug,body.f-aguja .aguja em{box-shadow:0 0 0 3px #facc15,0 0 36px rgba(250,204,21,.6)}
body.f-sug .sug{border-color:#facc15}
/* sugerencias */
.sug{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.3vh 1.2vw;display:grid;grid-template-columns:auto 1fr 1fr 1fr 1.45fr;gap:.8vw;align-items:stretch}
.sug h2{margin:0;align-self:center;font:900 clamp(11px,.95vw,16px)/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--oro);writing-mode:horizontal-tb;max-width:8vw}
.sug div{display:grid;grid-template-columns:auto 1fr;gap:.6vw;align-items:center;padding:.9vh .9vw;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  font:500 clamp(11px,.95vw,16px)/1.35 var(--f);color:#e4e4e7;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.sug div.ve{opacity:1;transform:none}
.sug div b{color:#fff}.sug div span:first-child{font-size:1.5em}
.sug div.areas{display:flex;flex-direction:column;align-items:stretch;gap:.6vh;border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.07)}
.sug div.areas>b{font:800 clamp(10px,.85vw,14px)/1.2 var(--f);letter-spacing:.06em;color:#86efac;text-transform:uppercase}
.sug .chips{display:flex;gap:.4vw;flex-wrap:wrap;justify-content:flex-start;align-items:center}
.sug .chips i{flex:0 0 auto;display:inline-block;font-style:normal;padding:.35vh .5vw;border-radius:7px;border:1.5px solid var(--c);color:var(--c);font:800 clamp(10px,.8vw,13px)/1.2 var(--f);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sug .chips i.top{background:var(--c);color:#111}
.sug small{font:500 clamp(9px,.7vw,12px)/1.3 var(--f);color:#a1a1aa}
#fuerzas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:8;overflow:visible}
#fuerzas path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#fuerzas .halo{stroke-opacity:.2}
#fuerzas .flujo{stroke:#fff;stroke-opacity:.55;stroke-dasharray:3 16;animation:fluye 1.1s linear infinite}
@keyframes fluye{to{stroke-dashoffset:-19}}
.chispa{position:fixed;width:5px;height:5px;border-radius:50%;background:#fff;pointer-events:none;z-index:9}
.onda{position:fixed;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:9;opacity:0}
</style></head>
