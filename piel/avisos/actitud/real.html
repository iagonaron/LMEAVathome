<style>

<script>
(function () {
  'use strict';
  var EST = [['EXCELENTE', '#3b82f6'], ['MUY BIEN', '#22c55e'], ['BIEN', '#eab308'], ['REGULAR', '#f59e0b'], ['MAL', '#ef4444']];
  function banda(v) { return Math.min(5, Math.max(1, Math.ceil((v - 0.5) / 2))); }
  function esMas(v) { return v >= 2 * banda(v) - 0.5; }
